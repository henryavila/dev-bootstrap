name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: docs windows
          # zsh is not a shellcheck-supported dialect (sh/bash/dash/ksh only);
          # these files are genuine zsh and parse-error under shellcheck.
          ignore_names: p10k.zsh mesh-guard.zsh auto-update.zsh
          severity: warning

      - name: bash syntax
        run: |
          set -e
          # Scan every surface that the Phase 1/2 restructure introduced:
          #   - bin/                 (mesh CLI dispatcher)
          #   - scripts/lib/         (engine libs, drivers, installers)
          #   - scripts/runners/     (auto-update, doctor)
          #   - scripts/internal/    (mesh-snap, mesh-status)
          #   - topics/              (per-topic install scripts + helpers)
          #   - setup.sh             (entry point; renamed from bootstrap.sh)
          # Older scopes (lib/ root, bootstrap.sh) no longer exist; do not
          # reintroduce them here.
          mapfile -t scripts < <(
            find bin scripts/lib scripts/runners scripts/internal topics -type f -name '*.sh'
            echo setup.sh
            [ -f bin/mesh ] && echo bin/mesh
          )
          IFS=$'\n' scripts=($(printf '%s\n' "${scripts[@]}" | sort -u))
          unset IFS
          for f in "${scripts[@]}"; do
            printf '→ bash -n %s\n' "$f"
            bash -n "$f"
          done
          printf '✓ all scripts parse cleanly (%d files)\n' "${#scripts[@]}"

      - name: manifest validation
        run: |
          # Lint every topics/*/manifest.yaml v2 against the schema (spec §8).
          # Non-strict: requires_bundles forward-refs to not-yet-migrated topics
          # are warnings during the F9.6 migration; hard rule breaks fail CI.
          bash scripts/lib/validate-manifest.sh
