# 10-languages — Node (fnm), npm-global, PHP multi-version, PECL extensions,
# Composer, Python. Heaviest topic; split into 5 logical bundles per platform.

# ─── Universal: Node runtime (fnm + Node LTS) ────────────────────
- name: node-fnm
  type: custom
  script: "./node-fnm.sh"
  desc: "fnm version manager + Node LTS via fnm install --lts"

# ─── Universal: NPM global prefix (opt-in via INCLUDE_NPM_GLOBAL) ────
- name: npm-global
  type: custom
  script: "./npm-global.sh"
  requires: [node-fnm]
  desc: "Configure ~/.npmrc prefix=$HOME/.npm-global + PATH fragments (INCLUDE_NPM_GLOBAL=1)"

# ─── Per-platform PHP stack (PHP versions + PECL + Composer + Python) ─
- name: php-stack-mac
  type: custom
  script: "./mac/php-stack.sh"
  platforms: [mac]
  desc: "Multi-PHP via brew@X.Y + PECL extensions + composer + per-version wrappers + Python"

- name: php-stack-wsl
  type: custom
  script: "./wsl/php-stack.sh"
  platforms: [wsl]
  desc: "Multi-PHP via ppa:ondrej/php + apt extensions + composer + per-version wrappers + Python"

# ─── Mac-only orphan-ini cleanup (migration safety net) ──────────
- name: php-orphan-ini-cleanup-mac
  type: custom
  script: "./mac/orphan-ini-cleanup.sh"
  platforms: [mac]
  requires: [php-stack-mac]
  idempotent: true   # silent when no orphans to remove
  desc: "Remove orphan PECL extension .ini files from old wrong-path bug (mac)"
