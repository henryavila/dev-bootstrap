# 40-tmux — tmux + TPM (Tmux Plugin Manager) + Catppuccin theme.
#
# 4 discrete items: tmux (brew on mac, apt on wsl), TPM clone (any platform),
# Catppuccin pinned to v1.0.3 (any platform). TPM + Catppuccin are wrapped
# as type:custom because the version-pinned clone + idempotent re-pull is
# beyond what the generic git-clone driver does today.

- name: tmux-mac
  type: brew-formula
  spec: tmux
  platforms: [mac]
  desc: "Terminal multiplexer (Homebrew)"

- name: tmux-wsl
  type: apt
  spec: tmux
  platforms: [wsl]
  desc: "Terminal multiplexer (apt)"

- name: tpm-clone
  type: custom
  script: "./clone-tpm.sh"
  desc: "Tmux Plugin Manager — cloned to ~/.tmux/plugins/tpm"

- name: catppuccin-tmux-clone
  type: custom
  script: "./clone-catppuccin.sh"
  desc: "Catppuccin tmux theme pinned to v1.0.3"
