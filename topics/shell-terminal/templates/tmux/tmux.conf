# ~/.tmux.conf — managed by mesh-workstation / 40-tmux

# Default shell — resolve from the authoritative login-shell registry,
# NOT from $SHELL. Rationale: $SHELL is frozen at login time and goes
# stale after chsh — long-lived ssh/mosh sessions that pre-date the
# shell change continue exporting the old value, so tmux started from
# them caches the wrong shell for every new pane. The old server only
# notices after `tmux kill-server` + reconnect. `run-shell` below
# executes at server-start (and every source-file reload) and queries:
#   Linux: getent passwd — authoritative /etc/passwd (+ NSS for LDAP)
#   macOS: dscl . -read /Users/$USER UserShell — authoritative DS
# and sets default-shell accordingly. Falls back gracefully if both
# lookups fail (preserves whatever default tmux had).
#
# Must be ONE line: tmux.conf treats backslash-newline as literal lines,
# NOT a shell continuation. Multi-line would split the argument into
# several tmux commands and render garbage like `execute: 0808/0808/0d0d`.
# `-b` backgrounds it so the helper's stdout never bubbles into the
# attached client's display. Redirections inside the command suppress
# dscl's errors on Linux and getent's errors on Mac.
#
# Companion detection in 20-terminal-ux's chsh block nags the user
# when $SHELL ≠ /etc/passwd or when an existing tmux server has a
# stale SHELL in its env.
run-shell -b 'S="$(getent passwd "$USER" 2>/dev/null | cut -d: -f7)"; [ -z "$S" ] && S="$(dscl . -read "/Users/$USER" UserShell 2>/dev/null | cut -d" " -f2)"; [ -n "$S" ] && [ -x "$S" ] && tmux set-option -g default-shell "$S" >/dev/null 2>&1'

# Prefix: Ctrl-a (screen-style), easier to reach than Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse + terminal capabilities
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*256col*:Tc'
set -sg escape-time 10

# Indexing: start at 1, renumber as windows close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits — intuitive characters, preserve cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window — preserve cwd too. Stock `prefix c` opens at the SESSION
# start directory, which reads as "the bar shows a stale folder" once the
# session is days old (root cause P3 in the 2026-06-09 redesign analysis).
bind c new-window -c "#{pane_current_path}"

# Pane navigation with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded tmux.conf"

# ─── Right-click: the tmux menu always wins ─────────────────────────
# The stock MouseDown3Pane binding forwards the click to the app whenever
# the app grabbed mouse reporting (mouse_any_flag) — fullscreen TUIs like
# Claude Code do exactly that and then treat the forwarded right-click as
# PASTE (text lands in the prompt). Rebind without the gate: right-click
# always opens a tmux menu; wheel/left-click/drag still reach the app.
# The menu is leaner than the stock pane menu and adds Rename Window
# (stock tmux only offers rename on the status-bar menu) — every entry
# that creates panes/windows preserves the cwd, matching `prefix c`/|/-.
bind-key -T root MouseDown3Pane display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x M -y M \
    "Rename Window"                       n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
    "New Window (cwd)"                    c { new-window -a -c "#{pane_current_path}" } \
    "" \
    "Split Horizontal"                    h { split-window -h -c "#{pane_current_path}" } \
    "Split Vertical"                      v { split-window -v -c "#{pane_current_path}" } \
    "#{?window_zoomed_flag,Unzoom,Zoom}"  z { resize-pane -Z } \
    "" \
    "Copy Mode (scroll)"                  s { copy-mode } \
    "Kill Pane"                           X { kill-pane } \
    "Detach"                              d { detach-client }

# History & copy-mode
set -g history-limit 100000
setw -g mode-keys vi

# Copy-mode vi bindings — fish/emacs-like selection on top of vi motions.
# Prefix-[ enters copy-mode; 'v' starts selection, 'y' yanks and exits.
# Bound against {copy-mode-vi} table explicitly so they don't collide with
# the default root-level letter bindings.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Status bar position — top keeps it visible on phone clients where
# the on-screen keyboard eats the bottom of the viewport.
set -g status-position top
set -g status-interval 5

# ─── Plugins via TPM ────────────────────────────────────────────────
# TPM (tmux plugin manager) lives at ~/.tmux/plugins/tpm, installed by
# mesh-workstation/topics/40-tmux/install.{wsl,mac}.sh along with a pre-
# cloned catppuccin/tmux v1.0.3 at ~/.tmux/plugins/tmux — so the theme
# is active on the first tmux launch with no `prefix + I` needed.
#
# To add more plugins: append `set -g @plugin '<owner>/<name>'` below,
# run `prefix + I` in a live session (or re-run bootstrap to pre-clone).
#
# Pin rationale: v1.0.3 uses the simple @catppuccin_* variables API used
# below. v2 introduced a module-based API that'd need a bigger rewrite.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v1.0.3'

# Catppuccin v1 config (applies at theme load time)
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_tabs_enabled on
set -g @catppuccin_date_time "%Y-%m-%d %H:%M"

# Status bar background — the surface_0 strip of the two-line design
# (see the status section at the end of this file). Setting it HERE, on
# the plugin's own variable, matters for ordering: TPM runs via
# run-shell, which tmux defers until after the whole file is parsed, so
# the theme's status-style assignment lands AFTER our inline
# `set -g status-style` below. Aligning the plugin variable makes the
# outcome identical no matter who writes last. (Historical: this used
# to be @thm_crust for a near-black bar; the 2026-06-09 redesign moved
# the bar to a continuous lualine/p10k-style strip.)
set -g @catppuccin_status_background "#313244"

# Square the leading edge of any catppuccin status module that might be
# used (e.g. the session module on status-left). v1.0.3 ships
# `left=""` (U+E0B6, rounded half-circle) by default; `█` keeps module
# edges flush with the square window list.
set -g @catppuccin_status_left_separator "█"

# Window tab text — smart format (2026-06-09 redesign, proposal A).
# The plugin default is bare `#T` (pane_title): apps own the tab and
# `prefix ,` appears broken (renames #W, bar keeps showing #T), and idle
# shells display the hostname (pane_title default). Three-way format:
#   1. manual rename (automatic-rename off) → honor #W: `prefix ,` sticks
#   2. else app title when meaningful (≠ host): Claude Code task titles
#      etc., stripped of any "user@host: " prefix that remote shells put
#      in titles (a host never lives in a tab — the host anchor is on
#      status line 2), truncated to 24 cols with …
#   3. else → #W (automatic-rename: the running command)
# The plugin sets these with -ogq (only-if-unset) at load and bakes the
# value into window-status-format WITHOUT re-expanding it, so pre-setting
# here is both effective and safe (verified live on tmux 3.4).
set -g @catppuccin_window_default_text " #{?#{==:#{automatic-rename},on},#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},#W,#{s/^[^@ ]+@[^: ]+: ?//;=|24|…:pane_title}},#W}"
set -g @catppuccin_window_current_text " #{?#{==:#{automatic-rename},on},#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},#W,#{s/^[^@ ]+@[^: ]+: ?//;=|24|…:pane_title}},#W}"

# TPM boot — must come BEFORE the status-right additions below so that
# the @catppuccin_status_host variable is defined when we reference it.
# Silently degrades to a default status bar if ~/.tmux/plugins/tpm is
# missing (new machine before bootstrap), not an error.
if-shell "[ -f $HOME/.tmux/plugins/tpm/tpm ]" \
    "run '$HOME/.tmux/plugins/tpm/tpm'"

# ─── Two-line status: line 1 = windows only, line 2 = context strip ─
# Design + live-validation trail: mesh-identity
# .ai/analysis/2026-06-09-tmux-interface-redesign.md (proposal G,
# iterations 1-6, approved 2026-06-09). Replaces the old single-line
# status-right blocks entirely.
#
# Visual grammar (lualine/p10k-style continuous strip):
#   - both lines sit on one surface_0 strip (status-style below + #[fill]
#     on line 2); "elevated" blocks use surface_1 (session, host+time);
#     state flags use accent backgrounds.
#   - line 1 carries ONLY the window tabs. Session name and all context
#     moved to line 2 so phone-width clients (Moshi/mosh, ~60 cols) keep
#     every tab visible — the old 120-col status-right squeezed the
#     window list off-screen on mobile.
#   - emergent bonus: inactive catppuccin tab text cells are surface_0,
#     the same color as the strip → inactive tabs sit flat, the active
#     tab (surface_1 + peach index) reads as elevated. Same hierarchy as
#     line 2 with zero extra theme configuration.
#
# Line 2 layout (left → right):
#   [session]  󰉋 cwd  󰊢 git-branch    ⚡C-a  ZOOM COPY SYNC  󰒋 user@host HH:MM
#   - cwd: ~-abbreviated full path; basename only under 90 cols. Uses
#     pane_current_path (live /proc-backed on Linux) — the old
#     @dev_bootstrap_pane_cwd indirection froze while TUIs ran (no precmd)
#     and was one root cause of "the bar shows a stale folder". The shell
#     fragments still write that option; nothing reads it here anymore.
#   - git branch: refreshed every status-interval via #().
#   - ⚡C-a lights up while the prefix is pending — instant feedback that
#     tmux heard the prefix (the historical "shortcuts don't work" pain).
#   - 󰒋 user@host + clock: ONLY while the active pane is in alternate
#     screen (fullscreen TUI hides the prompt). At a normal prompt p10k
#     already shows host+time — the bar must not duplicate it. Nested
#     tmux still tells cockpit (outer bar) from work host (inner bar).
#
# Gotchas — each cost a live iteration; do not "simplify" them away:
#   - #[a,b] multi-attribute styles BREAK inside #{?,} branches (the
#     comma splits the conditional). One attribute per #[] there.
#   - #() job output is NOT format-expanded: no #{@thm_*} inside the git
#     fragment — literal Mocha hex (green #a6e3a1, subtext #a6adc8).
#   - @mesh_home is resolved via run-shell at (re)load: $HOME does not
#     expand in single-quoted tmux strings and #{HOME} is not a format
#     variable. The s|^#{@mesh_home}|~| nested expansion is valid (man:
#     both s/ arguments may contain format variables; verified on 3.4).
#   - undefined #{@thm_*} (fresh machine pre-bootstrap) expand to empty:
#     accents/elevation degrade but every label still renders. The strip
#     colors are literal hex so the two-line layout never depends on the
#     theme being present.
run-shell -b 'tmux set -g @mesh_home "$HOME" >/dev/null 2>&1'

set -g status 2
set -g status-left ""
set -g status-right ""

# Continuous strip on BOTH lines. Full override (not -a append) so config
# reloads stay deterministic. This retires @catppuccin_status_background
# as the visible bar color (the strip owns the background now).
set -g status-style "bg=#313244,fg=#cdd6f4"

set -g @mesh_line2_left '#[bg=#{@thm_surface_1}]#[fg=#{@thm_lavender}]#[bold] #S #[nobold]#[bg=#313244] #[fg=#{@thm_teal}]󰉋 #[fg=#{@thm_subtext_1}]#{?#{e|<:#{client_width},90},#{b:pane_current_path},#{s|^#{@mesh_home}|~|:pane_current_path}}#(cd "#{pane_current_path}" 2>/dev/null && b=$(git branch --show-current 2>/dev/null) && [ -n "$b" ] && printf "  #[fg=#a6e3a1]󰊢 #[fg=#a6adc8]%s" "$b")'

set -g @mesh_line2_right '#{?client_prefix,#[bg=#{@thm_yellow}]#[fg=#{@thm_crust}]#[bold] ⚡C-a #[nobold]#[bg=#313244] ,}#{?window_zoomed_flag,#[bg=#{@thm_peach}]#[fg=#{@thm_crust}]#[bold] ZOOM #[nobold]#[bg=#313244] ,}#{?pane_in_mode,#[bg=#{@thm_sky}]#[fg=#{@thm_crust}]#[bold] COPY #[nobold]#[bg=#313244] ,}#{?pane_synchronized,#[bg=#{@thm_red}]#[fg=#{@thm_crust}]#[bold] SYNC #[nobold]#[bg=#313244] ,}#{?#{alternate_on},#[bg=#{@thm_surface_1}]#[fg=#{@thm_mauve}] 󰒋 #[fg=#{@thm_subtext_1}]#{?#{e|<:#{client_width},90},#h,#{user}@#h  #[fg=#{@thm_overlay_1}]%H:%M} ,}'

# #[fill] paints the WHOLE second line surface_0, including the gap
# between the left and right aligned sections. The range markers keep
# right-click menus working on line 2 (session menu over [#S]).
set -g status-format[1] '#[fill=#313244]#[bg=#313244]#[align=left range=left]#{T:@mesh_line2_left}#[norange]#[align=right range=right]#{T:@mesh_line2_right}#[norange]'
