#? Config file for btop v. 1.3.0 — managed by dotfiles/config/btop/btop.conf
#
# Minimal config: we only pin the color_theme (Catppuccin Mocha, deployed by
# dotfiles install.sh). Every other setting stays at btop's default so the
# binary's built-in defaults apply as they evolve across versions.

#* Theme file name (ommitting the .theme suffix) from themes folder.
color_theme = "catppuccin_mocha"

#* If the theme should be TrueColor (24-bit) or 256-color. True for 24-bit.
theme_background = True

#* Sets if 24-bit truecolor should be used.
truecolor = True

#* Check for new updates from github.com/aristocratos/btop at start.
update_check = False

#* Update time in milliseconds, recommended 1000 or above.
update_ms = 1500
