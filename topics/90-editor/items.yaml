# 90-editor — editor configs.
#
# The typora + typora-wait wrappers under templates/bin/ are deployed
# automatically by setup.sh's templates/ pass; nothing here installs an
# editor. The single engine item below links Neovim's default init.lua
# from configs/ to ~/.config/nvim/init.lua (identity overrides win on
# conflict — see scripts/lib/topic-configs.sh link_default_config).

- name: nvim-default-config
  type: custom
  script: "./link-nvim-config.sh"
  desc: "Link Neovim default init.lua (identity files win on conflict)"
