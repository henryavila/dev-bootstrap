- name: mdprobe
  type: npm-global
  spec: "@henryavila/mdprobe"
  check: "command -v mdprobe"
  desc: "Markdown preview server"
  platforms: [mac, wsl]

- name: atomic-skills
  type: npx
  spec: "@henryavila/atomic-skills@1.7.0 install --yes --all-detected --lang pt"
  desc: "Atomic skills — detect IDEs + install agent skills (runs every time)"
  platforms: [mac, wsl]

- name: rtk
  type: custom
  script: "./install-rtk.sh"
  # No manifest `check:` — engine `manifest_check` would override the
  # topic's install-rtk.sh check() function and bypass the `rtk gain`
  # name-collision guard that distinguishes this rtk (Rust Token Killer)
  # from reachingforthejack/rtk (Rust Type Kit). CP4 chunk A3 finding F-008.
  desc: "Rust Token Killer (token-optimized CLI proxy)"
  platforms: [mac, wsl]
