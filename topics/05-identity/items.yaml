# 05-identity — gh CLI + SSH key + GitHub registration.
#
# Runs BEFORE 95-dotfiles-personal so the private dotfiles clone works.
# 4 discrete items: gh on mac (brew), gh on wsl (custom — handles repo
# fallback for older Ubuntu), wslu on wsl (browser opener for `gh auth
# login`), and the shared setup-identity script (auth + SSH + GitHub).

- name: gh-mac
  type: brew-formula
  spec: gh
  platforms: [mac]
  desc: "GitHub CLI (Homebrew)"

- name: gh-wsl
  type: custom
  script: "./install-gh-wsl.sh"
  platforms: [wsl]
  desc: "GitHub CLI (apt; falls back to GitHub APT repo on older Ubuntu)"

- name: wslu
  type: apt
  spec: wslu
  platforms: [wsl]
  desc: "wslview helper — lets gh auth login open the Windows browser"

- name: identity-setup
  type: custom
  script: "./identity-setup.sh"
  requires: [gh-mac, gh-wsl]
  desc: "gh auth + SSH key generation + GitHub key registration (delegates to scripts/setup-identity.sh)"
