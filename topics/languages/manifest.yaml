# yaml-language-server: $schema=../../schema/manifest.schema.json
topic:
  label: "Languages"
  hint: "Node (fnm) + multi-PHP + Composer + Python"
  required: false
  order: 60
  description: |
    Language runtimes for development. Node via fnm (LTS), and a multi-version
    PHP stack (brew@X.Y on mac, ppa:ondrej/php on WSL) with PECL extensions,
    Composer, per-version wrappers, and Python. PHP backs the web stack.

bundles:

  - name: node
    label: "Node.js"
    desc: "Node LTS via fnm — the JS/TS runtime"
    icon_name: node
    options:
      - name: npm-global-prefix
        type: toggle
        label: "Configure a global npm prefix (~/.npm-global)"
        env: INCLUDE_NPM_GLOBAL
        default: false
    items:
      - name: node-fnm
        type: custom
        script: ./node-fnm.sh
      - name: npm-global
        type: custom
        script: ./npm-global.sh
        when: option.npm-global-prefix

  - name: php
    label: "PHP"
    desc: "Multi-version PHP + PECL + Composer + Python"
    icon_name: php
    options:
      - name: versions
        type: multiselect
        label: "PHP versions to install"
        env: PHP_VERSIONS
        source: ./data/php-versions.conf
        required_min: 1
        default: ["8.4"]
      - name: default-version
        type: select
        label: "Default PHP version"
        env: PHP_DEFAULT
        derive_from: versions
    items:
      - name: php-stack-mac
        type: custom
        script: ./mac/php-stack.sh
        platforms: [mac]
        uninstall_tier: 2
      - name: php-stack-wsl
        type: custom
        script: ./wsl/php-stack.sh
        platforms: [wsl]
        uninstall_tier: 2
      - name: php-orphan-ini-cleanup-mac
        type: custom
        script: ./mac/orphan-ini-cleanup.sh
        platforms: [mac]
        idempotent: true
