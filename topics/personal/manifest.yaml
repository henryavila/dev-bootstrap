# yaml-language-server: $schema=../../schema/manifest.schema.json
topic:
  label: "Personal identity"
  hint: "clone + apply your mesh-identity repo"
  required: true
  order: 30
  description: |
    Clones your private mesh-identity repo and runs its install.sh to apply your
    personal identity layer, then prunes drift artifacts the fork no longer ships.
    Required — this is what makes the machine yours.

bundles:

  - name: personal
    label: "Personal identity"
    desc: "Clone + apply your mesh-identity repo"
    required: true
    icon_name: home
    items:
      - name: apply
        type: custom
        script: ./apply.sh
        idempotent: true
