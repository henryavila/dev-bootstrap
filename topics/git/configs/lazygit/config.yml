# ~/.config/lazygit/config.yml — managed by dotfiles/config/lazygit/config.yml
#
# Catppuccin Mocha palette with Mauve accent, mirroring the accent used
# across the rest of the stack (fzf, delta, eza). Source palette:
# https://github.com/catppuccin/lazygit

gui:
  theme:
    activeBorderColor:
      - '#cba6f7'  # mauve
      - bold
    inactiveBorderColor:
      - '#a6adc8'  # subtext0
    optionsTextColor:
      - '#89b4fa'  # blue
    selectedLineBgColor:
      - '#313244'  # surface0
    cherryPickedCommitBgColor:
      - '#45475a'  # surface1
    cherryPickedCommitFgColor:
      - '#cba6f7'  # mauve
    unstagedChangesColor:
      - '#f38ba8'  # red
    defaultFgColor:
      - '#cdd6f4'  # text
    searchingActiveBorderColor:
      - '#f9e2af'  # yellow
  authorColors:
    '*': '#b4befe'  # lavender

# Performance + UX tweaks that pair well with the theme
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never
  parseEmoji: true

os:
  editPreset: 'nvim'
