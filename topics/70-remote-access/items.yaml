# 70-remote-access — sshd, Tailscale, mosh + MTU fixes for SSH-over-Tailscale.

# ─── macOS ─────────────────────────────────────────────────────────
- name: remote-login-mac
  type: custom
  script: "./enable-remote-login.sh"
  platforms: [mac]
  desc: "Enable Remote Login (sshd) via systemsetup"

- name: mosh-mac
  type: brew-formula
  spec: mosh
  platforms: [mac]
  desc: "Mobile shell (mosh)"

- name: mosh-path-mac
  type: custom
  script: "./mosh-path-fix.sh"
  platforms: [mac]
  requires: [mosh-mac]
  desc: "Register non-standard brew prefix in /etc/paths.d/ so sshd-exec finds mosh-server"

- name: tailscale-mac
  type: custom
  script: "./install-tailscale-mac.sh"
  platforms: [mac]
  desc: "Tailscale.app — brew cask with .pkg fallback for kext approval"

# ─── WSL ───────────────────────────────────────────────────────────
- name: systemd-wsl
  type: custom
  script: "./enable-systemd-wsl.sh"
  platforms: [wsl]
  desc: "Enable systemd in /etc/wsl.conf (requires wsl --shutdown to apply)"

- name: openssh-server-wsl
  type: apt
  spec: openssh-server
  platforms: [wsl]
  desc: "OpenSSH server (sshd)"

- name: mosh-wsl
  type: apt
  spec: mosh
  platforms: [wsl]
  desc: "Mobile shell (mosh)"

- name: tailscale-wsl
  type: custom
  script: "./install-tailscale-wsl.sh"
  platforms: [wsl]
  desc: "Tailscale install via curl-pipe (https://tailscale.com/install.sh)"

- name: tailscale-mtu-wsl
  type: custom
  script: "./tailscale-mtu-fix-wsl.sh"
  platforms: [wsl]
  requires: [tailscale-wsl]
  desc: "tailscaled systemd drop-in forcing tailscale0 MTU=1200 (prevents SSH KEX hang)"
