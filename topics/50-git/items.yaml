# 50-git — applies git global config (gitconfig.keys + gitconfig.removed),
# optional GPG signing setup, and links the lazygit default config.
#
# 3 discrete items so the future menu can let users skip GPG signing
# or the lazygit config independently of the core gitconfig sync.

- name: gitconfig-apply
  type: custom
  script: "./gitconfig-apply.sh"
  idempotent: true   # `git config --global` is itself idempotent
  desc: "Apply data/gitconfig.keys + unset removed + env GIT_NAME/GIT_EMAIL"

- name: gpg-signing
  type: custom
  script: "./gpg-signing.sh"
  desc: "Opt-in GPG commit/tag signing (activate with GPG_SIGN=1)"

- name: lazygit-default-config
  type: custom
  script: "./link-lazygit-config.sh"
  desc: "Link lazygit default config (identity overrides win on conflict)"
