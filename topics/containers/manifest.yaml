# yaml-language-server: $schema=../../schema/manifest.schema.json
topic:
  label: "Containers"
  hint: "Docker — Colima on mac, docker.io on WSL"
  required: false
  order: 80
  description: |
    Docker Engine for local development. macOS runs it headless via Colima
    (no Docker Desktop); WSL uses Ubuntu's docker.io + the compose v2 and
    buildx plugins, then adds you to the docker group.

bundles:

  - name: docker
    label: "Docker"
    desc: "Docker Engine — Colima (mac) / docker.io (WSL)"
    icon_name: docker
    items:
      - name: colima
        type: brew-formula
        spec: colima
        platforms: [mac]
        uninstall_tier: 3
      - name: docker
        type: brew-formula
        spec: docker
        platforms: [mac]
        uninstall_tier: 2
      - name: docker-compose
        type: brew-formula
        spec: docker-compose
        platforms: [mac]
        uninstall_tier: 1
      - name: docker-engine
        type: apt
        spec: docker.io
        platforms: [wsl]
        uninstall_tier: 3
      - name: docker-compose-v2
        type: apt
        spec: docker-compose-v2
        platforms: [wsl]
        uninstall_tier: 1
      - name: docker-buildx
        type: apt
        spec: docker-buildx
        platforms: [wsl]
        uninstall_tier: 1
      - name: docker-post-setup
        type: custom
        script: ./post-setup-wsl.sh
        platforms: [wsl]
        uninstall_tier: 2
