# yaml-language-server: $schema=../../schema/manifest.schema.json
topic:
  label: "AI"
  hint: "Claude Code, Moshi Hook, agent CLI tools"
  required: false
  order: 110
  description: |
    AI development tooling: the Claude Code CLI (+ Bun for claude-mem and the
    claudebar statusline), the Moshi Hook bridge to the Moshi mobile app, and
    a set of agent CLI tools (mdprobe, atomic-skills, rtk).

bundles:

  - name: claude-code
    label: "Claude Code"
    desc: "Claude Code CLI + Bun + claudebar statusline"
    icon_name: claude
    items:
      - name: bun
        type: custom
        script: ./install-bun.sh
      - name: claude-code-cli
        type: custom
        script: ./install-claude.sh
      - name: claudebar
        type: npx
        spec: "@henryavila/claudebar@latest install"
        check: "test -f $HOME/.config/claudebar/statusline.sh && jq -e '.statusLine.command | test(\"claudebar\")' $HOME/.claude/settings.json >/dev/null 2>&1"
      - name: shell-fragments
        type: deploy
        spec: ./templates/claude-code
        idempotent: true

  - name: moshi-hook
    label: "Moshi Hook"
    desc: "AI agent bridge to the Moshi mobile app"
    icon_name: phone
    items:
      - name: moshi-hook-mac
        type: brew-formula
        spec: rjyo/moshi/moshi-hook
        platforms: [mac]
      - name: moshi-hook-mac-service
        type: custom
        script: ./moshi-hook-service-mac.sh
        platforms: [mac]
      - name: moshi-hook-linux
        type: custom
        script: ./install-moshi-hook.sh
        platforms: [wsl]
      - name: moshi-hook-wsl-service
        type: custom
        script: ./moshi-hook-service-wsl.sh
        platforms: [wsl]

  # Each agent CLI tool is its own bundle (level 2) so it can be selected /
  # deselected individually — they are independent tools, not an atomic set.
  - name: mdprobe
    label: "mdprobe"
    desc: "Markdown preview & review in the browser"
    icon_name: text
    items:
      - name: mdprobe
        type: npm-global
        spec: "@henryavila/mdprobe"
        # Install-if-missing on setup (fast). Updating a stale install is the
        # job of the opt-in version-aware update mode (`mesh update`), NOT of
        # reinstalling every run — see docs/…-version-aware-update-spec.md.
        check: "command -v mdprobe"

  - name: atomic-skills
    label: "atomic-skills"
    desc: "Project-status & agent skills toolkit"
    icon_name: package
    items:
      - name: atomic-skills
        type: npx
        spec: "@henryavila/atomic-skills@1.7.0 install --yes --all-detected --lang pt"

  - name: rtk
    label: "rtk"
    desc: "Rust Token Killer — token-saving CLI proxy"
    icon_name: terminal
    items:
      - name: rtk
        type: custom
        script: ./install-rtk.sh

  - name: claude-mem
    label: "claude-mem"
    desc: "Persistent cross-session memory (Claude Code plugin + Bun worker)"
    icon_name: sync
    # Needs the Claude Code CLI + Bun in place first. The official installer
    # auto-installs Bun/uv if missing, but ai/claude-code pre-stages Bun so the
    # worker on :37777 starts cleanly on the first session (removes the
    # smart-install timing/connectivity coupling — see README).
    requires_bundles:
      - ai/claude-code
    items:
      - name: claude-mem
        type: npx
        # Official non-interactive installer (v13+, thedotmack/claude-mem):
        # registers the Claude Code plugin + lifecycle hooks and selects the
        # local `worker` runtime (SQLite on :37777). --no-auto-start leaves the
        # worker stopped; the dump/pull sync hooks (mesh-identity) bring it up.
        spec: "claude-mem@latest install --ide claude-code --provider claude --runtime worker --no-auto-start"
        # Idempotent self-healing check (overrides the npx driver's always-run
        # check). Passes only when the plugin is BOTH present (cache dir) AND its
        # marketplace deps are installed (node_modules) — so a cached-but-broken
        # install (deps missing, the real state found on mac) re-triggers the
        # installer, which reinstalls deps + registers the plugin. node_modules
        # path is version-dependent (v10: thedotmack/plugin/, v13: thedotmack/),
        # so probe both via -maxdepth 2 (portable -print -quit, no pipe).
        check: 'test -d "$HOME/.claude/plugins/cache/thedotmack/claude-mem" && [ -n "$(find "$HOME/.claude/plugins/marketplaces/thedotmack" -maxdepth 2 -name node_modules -type d -print -quit 2>/dev/null)" ]'
