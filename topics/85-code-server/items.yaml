# 85-code-server — standalone code-server binary + LaunchAgent + secrets + Tailscale serve.
#
# Mac-only. Single item — the install is a tightly-coupled state machine
# (~25 helper functions; binary install, LaunchAgent generation,
# password storage, healthz wait, Tailscale serve check) and splitting
# would require ~80 LOC of duplicated context per piece. The future menu
# can still toggle the whole topic on/off; sub-step toggling is a follow-up
# refactor.

- name: code-server
  type: custom
  script: "./mac/code-server.sh"
  platforms: [mac]
  desc: "code-server binary + LaunchAgent wrapper + secrets + healthz + optional Tailscale serve"
